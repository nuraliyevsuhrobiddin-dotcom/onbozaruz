---
# cPanel "Git Version Control" deployment for MollBazar (Ahost).
# Copies the whole build (frontend + PHP API in dist/api) into the web root.
# Uploaded media in api/storage/ and the server config are never overwritten,
# because they are not part of the build.
deployment:
  tasks:
    - export DEPLOYPATH=/home/oboxuz/mollbazar.uz/
    - npm ci
    - npm run build
    - /bin/cp -R dist/. $DEPLOYPATH
