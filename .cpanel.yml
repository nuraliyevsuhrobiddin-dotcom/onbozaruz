---
deployment:
  tasks:
    - export DEPLOYPATH=/home/oboxuz/mollbazar.uz/
    - npm ci
    - npm run build
    - /bin/cp dist/index.html $DEPLOYPATH
    - /bin/cp -R dist/assets $DEPLOYPATH
    - /bin/cp dist/privacy-policy.html dist/sw.js dist/manifest.webmanifest $DEPLOYPATH
    - /bin/cp dist/*.png dist/*.svg dist/*.jpg dist/*.webp dist/*.wav $DEPLOYPATH
