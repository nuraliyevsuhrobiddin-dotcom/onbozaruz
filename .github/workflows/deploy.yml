name: Deploy to Ahost cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Build production bundle
        env:
          # The PHP API is served by the same site under /api (the built-in default).
          VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: 5. Sync to Ahost cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./mollbazar.uz/
          dangerous-clean-slate: false
          # Uploaded media and the server-only config must survive every deploy.
          exclude: |
            **/.git*
            **/.git*/**
            api/storage/v1/**
            api/_data/tus/**
            api/_lib/config.php
